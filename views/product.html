<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ember &amp; Oak · Product</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <script async src="https://www.sandbox.paypal.com/web-sdk/v6/core"></script>
</head>
<body>
  {{HEADER}}
  <main class="wrap">
    <nav class="breadcrumb" id="crumbs" aria-label="Breadcrumb"><a href="/">Home</a></nav>
    <div class="product" id="product"></div>

    <section style="margin-top: 56px">
      <div class="section-head"><h2>You might also like</h2></div>
      <div class="grid" id="related"></div>
    </section>
  </main>
  {{FOOTER}}
  <script src="/store.js"></script>
  <script>
    const id = location.pathname.split("/").pop();
    Promise.all([
      fetch(`/api/products/${id}`).then((r) => r.json()).catch(() => null),
      fetch("/api/products").then((r) => r.json()).catch(() => []),
    ]).then(([p, all]) => {
      if (!p || p.error) {
        document.getElementById("product").innerHTML = `<p>Product not found. <a href="/">Return to shop</a></p>`;
        return;
      }
      const title = p.title || "Product";
      const category = p.category || "Gear";
      const price = p.price || "0.00";
      const image = p.image || "";
      const description = p.description || "";
      const stock = p.stock || 0;
      const specs = Array.isArray(p.specs) ? p.specs : [];

      document.title = `${title} · Ember & Oak`;
      document.getElementById("crumbs").innerHTML = `<a href="/">Home</a> / <a href="/#shop">${category}</a> / ${title}`;
      document.getElementById("product").innerHTML = `
        <div class="product-media"><img src="${image}" alt="${title}"></div>
        <div>
          <p class="eyebrow">${category}</p>
          <h1>${title}</h1>
          ${stars(p.rating, p.reviews)}
          <p class="price">$${price}</p>
          <div class="paylater-wrap">
            <paypal-message auto-bootstrap amount="${price}" currency-code="USD"></paypal-message>
          </div>
          <p>${description}</p>
          <div class="buy-row">
            <div class="qty" aria-label="Quantity">
              <button type="button" id="minus" aria-label="Decrease">−</button>
              <input id="qty" value="1" inputmode="numeric" aria-label="Quantity">
              <button type="button" id="plus" aria-label="Increase">+</button>
            </div>
            <button class="btn" id="add">Add to cart</button>
            <a class="btn outline" href="/cart">View cart</a>
          </div>
          <ul class="specs">${specs.map((s) => `<li>${s}</li>`).join("")}</ul>
          <div class="perks">
            <span>✓ ${stock ? `${stock} in stock, ` : ""}ships in 2 business days</span>
            <span>✓ Free shipping on orders over $75</span>
            <span>✓ 60-day returns and lifetime repairs</span>
          </div>
        </div>`;

      const qty = document.getElementById("qty");

      function updatePayLaterAmount() {
        const q = Math.max(1, parseInt(qty?.value, 10) || 1);
        const total = (Number(price) * q).toFixed(2);
        const msg = document.querySelector("paypal-message");
        if (msg) {
          msg.amount = total;
          msg.setAttribute("amount", total);
        }
      }

      document.getElementById("minus").onclick = () => {
        qty.value = Math.max(1, (parseInt(qty.value, 10) || 1) - 1);
        updatePayLaterAmount();
      };
      document.getElementById("plus").onclick = () => {
        qty.value = Math.max(1, (parseInt(qty.value, 10) || 1) + 1);
        updatePayLaterAmount();
      };
      qty.oninput = () => updatePayLaterAmount();

      document.getElementById("add").onclick = () => {
        addToCart(p, Math.max(1, parseInt(qty.value, 10) || 1));
        location.href = "/cart";
      };

      if (Array.isArray(all)) {
        document.getElementById("related").innerHTML = all
          .filter((x) => x && x.id !== p.id)
          .slice(0, 3)
          .map(productCard)
          .join("");
      }

      initProductMessages();
    });

    async function initProductMessages() {
      try {
        let attempts = 0;
        while ((!window.paypal || !window.paypal.createInstance) && attempts < 50) {
          await new Promise((r) => setTimeout(r, 100));
          attempts++;
        }
        if (!window.paypal || !window.paypal.createInstance) return;
        const clientId = "{{PAYPAL_CLIENT_ID}}";
        const sdkInstance = await window.paypal.createInstance({
          clientId,
          components: ["paypal-messages"],
          pageType: "product-details",
        });
        sdkInstance.createPayPalMessages();
      } catch (err) {
        console.error("Pay Later messaging error:", err);
      }
    }
  </script>
</body>
</html>
